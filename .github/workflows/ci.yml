name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache fixtures
        uses: actions/cache@v4
        with:
          path: fixtures/repos
          key: fixtures-${{ hashFiles('fixtures/fixtures.json') }}
      - run: npm run fixtures
      - run: npx tsc -b
      - run: npx tsc -p packages/vscode/tsconfig.json
      - run: npx vitest run
      - run: npm run build -w @project-atlas/webview
      - run: npm run build -w projectatlas
      - name: E2E in VS Code (AC-DX1, CodeLens, panel)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm run e2e -w projectatlas
      - name: Package VSIX (smoke)
        if: matrix.os == 'ubuntu-latest'
        working-directory: packages/vscode
        run: npx vsce package --no-dependencies -o project-atlas.vsix
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: vsix
          path: packages/vscode/project-atlas.vsix
      # Web app: single-file executable for this OS (Node SEA), proven to parse with workers,
      # then driven end to end in headless Chrome (import RuoYi-Vue, pyramid, source panel).
      - run: npm run build -w @project-atlas/web
      - name: Build the single-file executable
        run: node packages/web/build-sea.mjs --out dist-release
      - name: Self-test the executable (parse pool has workers)
        shell: bash
        run: |
          EXE="$(ls dist-release/project-atlas-* | grep -v sha256 | head -1)"
          "./$EXE" --self-test --home "$RUNNER_TEMP/atlas-selftest"
      - name: Web E2E (source build)
        run: node scripts/web-e2e.mjs
      - name: Web E2E (single-file executable)
        shell: bash
        run: node scripts/web-e2e.mjs --exe "$(ls dist-release/project-atlas-* | grep -v sha256 | head -1)"
      - uses: actions/upload-artifact@v4
        with:
          name: project-atlas-${{ matrix.os }}
          path: dist-release/project-atlas-*

  runtime-rabbitmq:
    # AC#22 on a real broker: two Spring Boot services, a topic exchange, the pinned javaagent.
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: npm ci
      - run: npx tsc -b
      - name: Build the RabbitMQ fixture
        working-directory: fixtures/synthetic/rabbitmq
        run: mvn -q -B -DskipTests package
      - name: Producer → exchange → queue → consumer, confirmed at runtime
        run: node scripts/runtime-e2e.mjs --rabbitmq-only
        env:
          RABBITMQ_REQUIRED: "1"

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - name: Synthetic 50k-file repository (AC-PERF)
        run: node scripts/perf-synthetic.mjs --files 50000 --budget-ms 90000

  release:
    # Tag v*: publish the executables (and their sha256) to a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: project-atlas-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/project-atlas-*
          fail_on_unmatched_files: true
